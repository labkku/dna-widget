<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Helix</title>
<style>
  :root { --navy: #1F2335; --paper: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body { display: flex; align-items: stretch; justify-content: center; padding: 8px; }
  .card {
    width: 100%; max-width: 220px; height: 100%; min-height: 240px;
    background: var(--paper);
    border-radius: 14px;
    padding: 10px 8px;
  }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div class="card"><canvas id="c" role="img" aria-label="천천히 회전하는 DNA 이중나선"></canvas></div>
<script>
  const STRAND_A = [31, 35, 53];
  const STRAND_B = [140, 198, 63];
  const RUNG = [208, 214, 200];
  const PAPER = [255, 255, 255];

  const c = document.getElementById("c");
  const x = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0;

  function size() {
    const r = c.getBoundingClientRect(), d = devicePixelRatio || 1;
    W = r.width; H = r.height;
    c.width = W * d; c.height = H * d;
    x.setTransform(d, 0, 0, d, 0, 0);
  }

  const mix = (rgb, k) =>
    `rgb(${Math.round(PAPER[0] + (rgb[0] - PAPER[0]) * k)},${Math.round(PAPER[1] + (rgb[1] - PAPER[1]) * k)},${Math.round(PAPER[2] + (rgb[2] - PAPER[2]) * k)})`;
  const smooth = (t) => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };

  function point(y, angle, amp, cx) {
    const X = Math.sin(angle) * amp;
    const Z = Math.cos(angle) * amp;
    const f = 320;
    const s = f / (f - Z);
    return { x: cx + X * s, y: y - Z * 0.12, depth: (Z / amp + 1) / 2 };
  }

  function draw(t) {
    x.clearRect(0, 0, W, H);
    const cx = W / 2;
    const amp = Math.min(W * 0.3, 44);
    const pitch = 160;
    const gap = 9;
    const top = 14, bottom = H - 14;
    const fadeLen = Math.min(60, H * 0.15);
    const spin = reduce ? 0.9 : (t / 1000) * 0.5;

    const rows = [];
    for (let y = top; y <= bottom; y += gap) {
      const a = (y / pitch) * Math.PI * 2 + spin;
      const edge = smooth((y - top) / fadeLen) * smooth((bottom - y) / fadeLen);
      rows.push({ A: point(y, a, amp, cx), B: point(y, a + Math.PI, amp, cx), edge });
    }

    x.lineCap = "round";

    for (let i = 0; i < rows.length; i += 2) {
      const { A, B, edge } = rows[i];
      x.strokeStyle = mix(RUNG, 0.9 * edge);
      x.lineWidth = 1;
      x.beginPath(); x.moveTo(A.x, A.y); x.lineTo(B.x, B.y); x.stroke();
    }

    const items = [];
    rows.forEach((row, i) => {
      for (const [key, col] of [["A", STRAND_A], ["B", STRAND_B]]) {
        const p = row[key];
        items.push({ type: "dot", p, col, edge: row.edge, z: p.depth });
        const next = rows[i + 1];
        if (next) {
          const q = next[key];
          items.push({ type: "seg", p, q, col, edge: Math.min(row.edge, next.edge), z: (p.depth + q.depth) / 2 - 0.001 });
        }
      }
    });
    items.sort((a, b) => a.z - b.z);

    for (const it of items) {
      const k = (0.18 + it.z * 0.82) * it.edge;
      if (it.type === "seg") {
        x.strokeStyle = mix(it.col, k * 0.55);
        x.lineWidth = 1.2;
        x.beginPath(); x.moveTo(it.p.x, it.p.y); x.lineTo(it.q.x, it.q.y); x.stroke();
      } else {
        const r = 1.4 + it.z * 3.4;
        x.fillStyle = mix(it.col, k);
        x.beginPath(); x.arc(it.p.x, it.p.y, r, 0, Math.PI * 2); x.fill();
      }
    }

    if (!reduce) requestAnimationFrame(draw);
  }

  size();
  addEventListener("resize", () => { size(); if (reduce) draw(0); });
  requestAnimationFrame(draw);
</script>
</body>
</html>
